name: C5VRX-5 Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'components/**'
      - 'test/**'
      - 'tools/**'
      - '!**/*.md'
      - '.github/workflows/c5vrx5.yml'
  pull_request:
    # Closed PR channels are removed by pr-channel-cleanup.yml.
    types: [opened, synchronize, reopened]
    paths:
      - 'firmware/**'
      - 'components/**'
      - 'test/**'
      - 'tools/**'
      - '!**/*.md'
      - '.github/workflows/c5vrx5.yml'
permissions:
  contents: read
concurrency:
  group: c5vrx5-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-psram:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build opt-in XIAO PSRAM image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/detector
          idf.py -B build-psram -DSDKCONFIG=sdkconfig.psram \
            "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.psram.defaults" build
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve version
        id: version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Main builds are 5.0.<run number> (immutable tag c5vrx5-v5.0.N);
          # PR builds share one mutable channel per PR.
          if [[ -n "$PR_NUMBER" ]]; then
            echo "version=5.0.0-pr.${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=c5vrx5-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=5.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=c5vrx5-v5.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Host tests (quiet test, VTX deviation profile, dropout classifier, AFC, gain fade)
        shell: bash
        working-directory: test
        run: |
          set -euo pipefail   # each compile on its own line: in "cc && ./t" a failed cc did not stop -e
          for t in test_quiet test_profile test_diag test_afc test_afc_measure test_control_window test_cn_observation test_calibration_noise test_sphase test_dco_slots test_dc_servo test_flightlog test_rx_state test_dac_check test_sense_metrics; do
            cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx "$t.c" -lm -o "/tmp/$t"
            "/tmp/$t" | tail -1
          done
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_dc_trim.c -o /tmp/test_dc_trim
          /tmp/test_dc_trim
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_no_signal_raster.c ../components/c5vrx_rx/menu_raster.c -lm -o /tmp/test_no_signal_raster
          /tmp/test_no_signal_raster
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_menu_ui.c ../components/c5vrx_rx/menu_ui.c -o /tmp/test_menu_ui
          /tmp/test_menu_ui
          python3 ../tools/menu_font.py --check
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_agc_table.c ../components/c5vrx_rx/arc_phy.c -o /tmp/test_agc_table
          /tmp/test_agc_table | tail -1
          cc -O2 -std=c11 -Wall -Wextra -Werror -DEXPECT_FADE_HOLD -I../components/c5vrx_rx test_gain_fade.c \
            ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_gain_fade
          /tmp/test_gain_fade | tail -1
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_gain_preset.c \
            ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_gain_preset
          /tmp/test_gain_preset | tail -1
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_gain_v7.c ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_gain_v7
          /tmp/test_gain_v7
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_rx_level.c ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_rx_level
          /tmp/test_rx_level
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_keel_track.c ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_keel_track
          /tmp/test_keel_track | grep -v "^S,"
          # AGC models (agc.c) against KEEL-1, scored on the measured demod quality (level_quality.h)
          # with the blackbox write cost: nominal and a board-like gain-model error.
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx -DSKIP_BOUNDS -DAGC_CHECKS -DPICTURE_Q -DWRITE_COST_US=7000 test_agc_compare.c ../components/c5vrx_rx/agc.c ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_agc_compare
          /tmp/test_agc_compare | tail -5
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx -DSKIP_BOUNDS -DAGC_CHECKS -DPICTURE_Q -DWRITE_COST_US=7000 -DGAIN_ERR_DB=1.0 -DGAIN_ERR_LOW_DB=6.0 test_agc_compare.c ../components/c5vrx_rx/agc.c ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_agc_compare_err
          /tmp/test_agc_compare_err | tail -5
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_agc_options.c ../components/c5vrx_rx/agc.c -lm -o /tmp/test_agc_options
          /tmp/test_agc_options
          # LEVEL's carrier radius of a folded window on the exact hardware fold model (adc_fold.h)
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_fold_radius.c ../components/c5vrx_rx/agc.c -lm -o /tmp/test_fold_radius
          /tmp/test_fold_radius
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_gain_measured.c ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_gain_measured
          /tmp/test_gain_measured
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_gain_track.c ../components/c5vrx_rx/gain.c ../components/c5vrx_rx/arc_phy.c -lm -o /tmp/test_gain_track
          /tmp/test_gain_track | grep -v "^R," | tail -8
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/c5vrx_rx test_afc_evidence.c -o /tmp/test_afc_evidence
          /tmp/test_afc_evidence
          # Checkpoint audio helpers (components/audio_player): pitch table, resampler, gain.
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/audio_player/include test_audio_resample.c -lm -o /tmp/test_audio_resample
          /tmp/test_audio_resample | tail -1
          # Checkpoint pass detector (components/pass_detector) on synthetic C/N traces.
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/pass_detector/include test_pass_detector.c \
            ../components/pass_detector/pass_detector.c -lm -o /tmp/test_pass_detector
          /tmp/test_pass_detector | tail -1
          # C5<->C3 UART protocol (components/link_proto): framing, CRC, resync.
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/link_proto/include test_link_proto.c \
            ../components/link_proto/link_proto.c -o /tmp/test_link_proto
          /tmp/test_link_proto | tail -1
          # C6<->C3 ESP-NOW protocol (components/fleet_proto).
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/fleet_proto/include \
            -I../components/link_proto/include test_fleet_proto.c \
            ../components/fleet_proto/fleet_proto.c ../components/link_proto/link_proto.c -o /tmp/test_fleet_proto
          /tmp/test_fleet_proto | tail -1
          # Race timing engine (components/race_timing): laps/sectors per channel.
          cc -O2 -std=c11 -Wall -Wextra -Werror -I../components/race_timing/include test_race_timing.c \
            ../components/race_timing/race_timing.c -o /tmp/test_race_timing
          /tmp/test_race_timing | tail -1
      - name: Diagnostic log semantics
        run: |
          python3 test/test_field_diag_compare.py
          python3 test/test_dac_check_tool.py
          python3 test/test_flash_tool.py
          python3 test/test_diag_snapshot_runtime.py
          python3 test/test_flight_log_tool.py
          python3 test/test_experimental_phy.py
          python3 test/test_experimental.py
          python3 test/test_settings.py
          python3 test/test_phy_observation_hook.py
          python3 test/test_bank1_watch_runtime.py
          python3 test/test_11p_runtime.py
          python3 test/test_dfilt_runtime.py
          python3 test/test_gain_map_context.py
          python3 test/test_afc_telemetry.py
          python3 test/test_sphase_runtime.py
          python3 test/test_sense_lab_tool.py
          python3 test/test_bias_suite_runtime.py
          python3 test/test_current_suite_runtime.py
          python3 test/test_loopcap_suite_runtime.py
          python3 test/test_spur_suite_runtime.py
          python3 test/test_phase_repair_runtime.py
          python3 test/test_calibration_search_runtime.py
          python3 test/test_manual_calibration_runtime.py
      - name: Build C5VRX-5
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/detector
          idf.py -DC5VRX5_VERSION="${{ steps.version.outputs.version }}" \
            -DC5VRX5_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}" build
      - name: Build Checkpoint C3 bridge
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/node
          idf.py build
      - name: Build Checkpoint C6 master
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/master
          idf.py build
      - name: Package firmware for web flashing
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p release
          cp firmware/detector/build/c5vrx5.bin firmware/detector/build/bootloader/bootloader.bin \
             firmware/detector/build/partition_table/partition-table.bin firmware/detector/build/flasher_args.json release/
          esptool.py --chip esp32c5 merge_bin -o release/c5vrx5_merged.bin \
            --flash_mode dio --flash_size 8MB --flash_freq 80m \
            0x2000 release/bootloader.bin 0x8000 release/partition-table.bin 0x10000 release/c5vrx5.bin
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > release/COMMIT
          python3 tools/firmware_input_hash.py 5 > release/FIRMWARE_INPUT_SHA
          printf '%s\n' '${{ steps.version.outputs.version }}' > release/VERSION
          cd release && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: c5vrx5-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: release/
  publish:
    needs: [build, build-psram]
    # Fork builds never get write-capable publication.
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c5vrx5-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
      - name: Publish C5VRX-5 build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # A PR closed during the build gets no channel (the cleanup sweep may already have run).
          if [[ -n "$PR_NUMBER" ]] &&
             [[ "$(gh pr view "$PR_NUMBER" --repo "$repo" --json state --jq .state)" != "OPEN" ]]; then
            echo "PR #${PR_NUMBER} is no longer open; not publishing."
            exit 0
          fi
          # Unchanged firmware inputs keep the existing build.
          if [[ -n "$PR_NUMBER" ]]; then previous="$TAG"; else
            previous="$(gh release list --repo "$repo" --limit 100 --json tagName,isDraft \
              | jq -r '.[] | select(.isDraft == false) | .tagName' \
              | grep -E '^c5vrx5-v5\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          fi
          if [[ -n "$previous" ]] && gh release view "$previous" --repo "$repo" >/dev/null 2>&1; then
            dir="$(mktemp -d)"
            if gh release download "$previous" --repo "$repo" --pattern FIRMWARE_INPUT_SHA --dir "$dir" &&
               cmp -s "$dir/FIRMWARE_INPUT_SHA" release/FIRMWARE_INPUT_SHA; then
              echo "Firmware inputs unchanged; keeping $previous."
              # C5VRX-5 is the main firmware: its newest versioned build is
              # the repository's Latest release (never a PR prerelease).
              if [[ -z "$PR_NUMBER" ]]; then gh release edit "$previous" --repo "$repo" --latest; fi
              exit 0
            fi
            # Only PR channels are replaced; versioned main builds are immutable.
            if [[ -n "$PR_NUMBER" ]]; then gh release delete "$TAG" --repo "$repo" --yes --cleanup-tag; fi
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            title="C5VRX-5 — PR #${PR_NUMBER} / unmerged"
            flags=(--prerelease --latest=false)
          else
            title="C5VRX-5 v${VERSION}"
            flags=(--latest)   # main builds are the repository's Latest release
          fi
          gh release create "$TAG" release/* --repo "$repo" --target "$BUILD_SHA" --title "$title" \
            "${flags[@]}" \
            --notes "C5VRX-5 ${VERSION} at ${BUILD_SHA}. Use Full firmware when switching from another generation."
