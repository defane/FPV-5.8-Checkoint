<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkpoint C6</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #14171c; color: #e7ebf0; }
  header { padding: 14px 16px; background: #1b2026; font-weight: 600; font-size: 1.1rem;
           display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  main { padding: 16px; max-width: 760px; margin: 0 auto; }
  h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .04em; color: #8b97a7; margin: 22px 0 8px; }
  .card { background: #1b2026; border: 1px solid #2a313a; border-radius: 10px; padding: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid #2a313a; }
  th { color: #8b97a7; font-weight: 600; }
  input { background: #0f1216; color: #e7ebf0; border: 1px solid #2a313a; border-radius: 6px; padding: 6px; }
  input[type=number] { width: 64px; }
  button { background: #2f6feb; color: #fff; border: 0; border-radius: 7px; padding: 7px 12px; font-size: .85rem; cursor: pointer; }
  button.ghost { background: #2a313a; } button.warn { background: #b4402f; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .stat { flex: 1 1 100px; } .stat b { display: block; font-size: 1.3rem; } .stat span { color: #8b97a7; font-size: .78rem; }
  .pill { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: #2a313a; }
  .pill.admin { background: #14532d; color: #86efac; }
  .on { color: #2ecc71; } .off { color: #8b97a7; } .muted { color: #8b97a7; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .admin-only { display: none; }
  body.is-admin .admin-only { display: revert; }
  body.is-admin .admin-only.bar { display: flex; }
</style>
</head>
<body>
<header>
  <span>Checkpoint C6 — race</span>
  <span class="bar"><span id="gates" class="pill">—</span><span id="role" class="pill">spectator</span>
  <button id="login_btn" class="ghost">Admin login</button></span>
</header>
<main>
  <div id="login" class="card admin-only-login" style="display:none; margin-bottom:8px">
    <div class="bar">
      <input id="u" placeholder="user" value="admin" style="width:110px">
      <input id="p" type="password" placeholder="password" style="width:140px">
      <button id="unlock">Unlock</button>
      <span id="login_msg" class="muted"></span>
    </div>
  </div>

  <h2>Standings</h2>
  <div class="card">
    <table>
      <thead><tr><th>Channel</th><th>Laps</th><th>Last lap</th><th>Best lap</th><th>Last gate</th></tr></thead>
      <tbody id="standings"><tr><td colspan="5" class="muted">no passes yet</td></tr></tbody>
    </table>
    <div class="bar admin-only" style="margin-top:12px"><button id="reset" class="warn">Reset race</button></div>
  </div>

  <h2>Gates / nodes</h2>
  <div class="card">
    <div class="bar" style="margin-bottom:10px">Pairing: <b id="pair_state" class="off">closed</b>
      <button id="pair_toggle" class="admin-only">Toggle pairing</button></div>
    <table>
      <thead><tr><th>Gate</th><th>Channel</th><th>Node</th><th>Link</th><th>C/N</th><th class="admin-only"></th></tr></thead>
      <tbody id="nodes"><tr><td colspan="6" class="muted">no nodes paired</td></tr></tbody>
    </table>
    <p class="muted" style="margin:10px 0 0">Gate 0 is the master's own C5.</p>
  </div>

  <h2>Local gate (0)</h2>
  <div class="card row">
    <div class="stat"><b id="l_cn">—</b><span>C/N dB</span></div>
    <div class="stat"><b id="l_ch">—</b><span>channel</span></div>
    <div class="stat"><b id="l_passes">—</b><span>total passes</span></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = ms => ms ? (ms/1000).toFixed(3) + " s" : "—";
let admin = false, auth = null, editing = false;

async function post(url, obj) {
  const h = { "Content-Type": "application/json" };
  if (auth) h["Authorization"] = auth;
  const r = await fetch(url, { method: "POST", headers: h, body: JSON.stringify(obj) });
  if (r.status === 401) { admin = false; document.body.classList.remove("is-admin"); $("role").textContent = "spectator"; $("role").className = "pill"; }
  return r;
}

$("login_btn").addEventListener("click", () => {
  const el = $("login"); el.style.display = el.style.display === "none" ? "block" : "none";
});
$("unlock").addEventListener("click", async () => {
  auth = "Basic " + btoa($("u").value + ":" + $("p").value);
  const r = await fetch("/api/auth", { headers: { "Authorization": auth } });
  if (r.ok) {
    admin = true; document.body.classList.add("is-admin");
    $("role").textContent = "admin"; $("role").className = "pill admin";
    $("login").style.display = "none"; $("login_msg").textContent = "";
  } else { auth = null; $("login_msg").textContent = "wrong credentials"; }
});

async function poll() {
  try {
    const s = await (await fetch("/api/state")).json();
    $("gates").textContent = s.num_gates + " gate(s)";
    $("pair_state").textContent = s.pairing ? "OPEN" : "closed";
    $("pair_state").className = s.pairing ? "on" : "off";
    const L = s.local || {};
    $("l_cn").textContent = (s.has_local && L.cn_x10 > -990) ? (L.cn_x10/10).toFixed(1) : "—";
    $("l_ch").textContent = s.has_local ? L.channel : "—";
    $("l_passes").textContent = s.total_passes;

    const st = s.standings || [];
    $("standings").innerHTML = st.length ? st.map(x => `
      <tr><td>${x.channel}</td><td>${x.laps}</td><td>${fmt(x.last_lap_ms)}</td>
      <td>${fmt(x.best_lap_ms)}</td><td>${x.last_gate<0?'—':x.last_gate}</td></tr>`).join("")
      : '<tr><td colspan="5" class="muted">no passes yet</td></tr>';

    if (!editing) {
      const nodes = s.nodes || [];
      $("nodes").innerHTML = nodes.length ? nodes.map(n => admin ? `
        <tr data-id="${n.node_id}">
          <td><input type="number" min="1" max="15" value="${n.gate}" class="g"></td>
          <td><input type="number" min="0" max="47" value="${n.channel}" class="c"></td>
          <td class="muted">${n.mac.slice(9)}</td>
          <td class="${n.online?'on':'off'}">${n.online?'online':'offline'}</td>
          <td>${n.cn_x10>-990?(n.cn_x10/10).toFixed(1):'—'}</td>
          <td class="admin-only"><button class="save">Save</button> <button class="ghost rm">✕</button></td>
        </tr>` : `
        <tr><td>${n.gate}</td><td>${n.channel}</td><td class="muted">${n.mac.slice(9)}</td>
          <td class="${n.online?'on':'off'}">${n.online?'online':'offline'}</td>
          <td>${n.cn_x10>-990?(n.cn_x10/10).toFixed(1):'—'}</td></tr>`).join("")
        : '<tr><td colspan="6" class="muted">no nodes paired</td></tr>';
    }
  } catch (e) { $("gates").textContent = "offline"; }
}

$("pair_toggle").addEventListener("click", async () => {
  await post("/api/pairing", { open: $("pair_state").textContent !== "OPEN" ? 1 : 0 }); poll();
});
$("reset").addEventListener("click", async () => { await post("/api/reset", {}); poll(); });
document.addEventListener("focusin", e => { if (e.target.closest("#nodes")) editing = true; });
$("nodes").addEventListener("click", async e => {
  const tr = e.target.closest("tr"); if (!tr || !admin) return;
  const id = +tr.dataset.id;
  if (e.target.classList.contains("save")) {
    await post("/api/node", { node_id: id, gate: +tr.querySelector(".g").value, channel: +tr.querySelector(".c").value });
    editing = false; poll();
  } else if (e.target.classList.contains("rm")) {
    await post("/api/node_remove", { node_id: id }); editing = false; poll();
  }
});
poll(); setInterval(poll, 1000);
</script>
</body>
</html>
