  <title>wiring-c5c5.svg</title>
  <g id="Layer_1" data-name="Layer 1">
    <rect id="rect4" x="0" y="0" width="1180" height="640" fill="#ffffff"/>
    <text id="text4" transform="matrix(1 0 0 1 40 42)" x="0" y="0" xml:space="preserve" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#0f172a"><tspan x="0" y="0">Temporary set — C5 + C5 (C5 as master)</tspan></text>
    <text id="text5" transform="matrix(1 0 0 1 40 66)" x="0" y="0" xml:space="preserve" font-family="system-ui, sans-serif" font-size="13" fill="#64748b"><tspan x="0" y="0">A stand-in for C6+C5 until the C6 arrives: a second C5 runs the master firmware built for esp32c5.</tspan></text>
    <text id="text6" transform="matrix(1 0 0 1 40 85)" x="0" y="0" xml:space="preserve" font-family="system-ui, sans-serif" font-size="13" fill="#64748b"><tspan x="0" y="0">Build: (cd firmware/master &amp;&amp; idf.py -DIDF_TARGET=esp32c5 -DSDKCONFIG=sdkconfig.c5 -DSDKCONFIG_DEFAULTS=sdkconfig.c5.defaults -B build-c5 build)</tspan></text>
