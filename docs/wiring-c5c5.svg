    <text id="text42" transform="matrix(1 0 0 1 565.931 492.471)" x="0" y="0" xml:space="preserve" font-family="system-ui, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle"><tspan x="0" y="0">Wi-Fi AP + web (admin / spectator)</tspan></text>
    <text id="text43" transform="matrix(1 0 0 1 40 560)" x="0" y="0" xml:space="preserve" font-family="system-ui, sans-serif" font-size="12" fill="#64748b"><tspan x="0" y="0">The master C5 runs no receiver, so GPIO 16-22 (its SPI flash) stay clear: the amp uses the proven C5 pins 9/8/7/10 (SD on 10; GPIO7 is strapping).</tspan></text>
    <text id="text44" transform="matrix(1 0 0 1 40 580)" x="0" y="0" xml:space="preserve" font-family="system-ui, sans-serif" font-size="12" fill="#64748b"><tspan x="0" y="0">Swap this C5 for a real C6 later with no wiring change on the gate side; only the master&apos;s amp pins move to 18/19/20/21 on the C6.</tspan></text>
