<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0d9488"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="v" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="40" y="42" font-size="23" font-weight="700" fill="#0f172a">Temporary set — C5 + C5 (C5 as master)</text>
  <text x="40" y="66" font-size="13" fill="#64748b">A stand-in for C6+C5 until the C6 arrives: a second C5 runs the master firmware built for esp32c5.</text>
  <text x="40" y="85" font-size="13" fill="#64748b">Build:  (cd firmware/c6 &amp;&amp; idf.py -DIDF_TARGET=esp32c5 -DSDKCONFIG=sdkconfig.c5 -DSDKCONFIG_DEFAULTS=sdkconfig.c5.defaults -B build-c5 build)</text>

  <!-- gate C5 -->
  <rect x="50" y="205" width="190" height="240" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="145" y="237" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C5</text>
  <text x="145" y="256" font-size="11" fill="#64748b" text-anchor="middle">gate · firmware/c5</text>
  <text x="145" y="272" font-size="11" fill="#64748b" text-anchor="middle">RF detect</text>
  <!-- master C5 -->
  <rect x="440" y="170" width="250" height="340" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="565" y="202" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C5 as master</text>
  <text x="565" y="221" font-size="11" fill="#64748b" text-anchor="middle">firmware/c6 @ esp32c5</text>
  <text x="565" y="237" font-size="11" fill="#64748b" text-anchor="middle">UART + sound + web</text>
  <!-- amp -->
  <rect x="820" y="185" width="190" height="300" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="915" y="217" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">MAX98357A</text>
  <path d="M1050,265 h24 l28,-22 v104 l-28,-22 h-24 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1082" y="371" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">4 Ω</text>

  <!-- UART gate<->master -->
  <line x1="240" y1="285" x2="440" y2="285" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="440" y1="335" x2="240" y2="335" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="240" y1="395" x2="440" y2="395" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="340" y="277" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600">UART link_proto</text>
  <g font-size="11" font-family="ui-monospace,monospace" fill="#0f172a">
    <circle cx="240" cy="285" r="4" fill="#16a34a"/><text x="232" y="281" text-anchor="end">GPIO6 TX</text>
    <circle cx="240" cy="335" r="4" fill="#16a34a"/><text x="232" y="331" text-anchor="end">GPIO15 RX</text>
    <circle cx="240" cy="395" r="4" fill="#475569"/><text x="232" y="391" text-anchor="end">GND</text>
    <circle cx="440" cy="285" r="4" fill="#16a34a"/><text x="448" y="281">GPIO5 RX</text>
    <circle cx="440" cy="335" r="4" fill="#16a34a"/><text x="448" y="331">GPIO4 TX</text>
    <circle cx="440" cy="395" r="4" fill="#475569"/><text x="448" y="391">GND</text>
  </g>

  <!-- I2S master<->amp (C5 amp pins 9/8/7/10) -->
  <line x1="690" y1="225" x2="820" y2="225" stroke="#0d9488" stroke-width="2.5" marker-end="url(#t)"/>
  <line x1="690" y1="265" x2="820" y2="265" stroke="#0d9488" stroke-width="2.5" marker-end="url(#t)"/>
  <line x1="690" y1="305" x2="820" y2="305" stroke="#0d9488" stroke-width="2.5" marker-end="url(#t)"/>
  <line x1="690" y1="345" x2="820" y2="345" stroke="#0d9488" stroke-width="2.5" marker-end="url(#t)"/>
  <line x1="690" y1="430" x2="820" y2="430" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
  <line x1="690" y1="465" x2="820" y2="465" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="755" y="217" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="600">I2S</text>
  <g font-size="11" font-family="ui-monospace,monospace" fill="#0f172a">
    <circle cx="690" cy="225" r="4" fill="#0d9488"/><text x="682" y="221" text-anchor="end">GPIO9 BCLK</text>
    <circle cx="690" cy="265" r="4" fill="#0d9488"/><text x="682" y="261" text-anchor="end">GPIO8 LRC</text>
    <circle cx="690" cy="305" r="4" fill="#0d9488"/><text x="682" y="301" text-anchor="end">GPIO7 DIN</text>
    <circle cx="690" cy="345" r="4" fill="#0d9488"/><text x="682" y="341" text-anchor="end">GPIO10 SD</text>
    <circle cx="690" cy="430" r="4" fill="#dc2626"/><text x="682" y="426" text-anchor="end">5V</text>
    <circle cx="690" cy="465" r="4" fill="#475569"/><text x="682" y="461" text-anchor="end">GND</text>
    <circle cx="820" cy="225" r="4" fill="#0d9488"/><text x="828" y="221">BCLK</text>
    <circle cx="820" cy="265" r="4" fill="#0d9488"/><text x="828" y="261">LRC</text>
    <circle cx="820" cy="305" r="4" fill="#0d9488"/><text x="828" y="301">DIN</text>
    <circle cx="820" cy="345" r="4" fill="#0d9488"/><text x="828" y="341">SD</text>
    <circle cx="820" cy="430" r="4" fill="#dc2626"/><text x="828" y="426">VIN 5V</text>
    <circle cx="820" cy="465" r="4" fill="#475569"/><text x="828" y="461">GND</text>
  </g>
  <line x1="1010" y1="300" x2="1050" y2="300" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#v)"/>
  <line x1="1010" y1="345" x2="1050" y2="345" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#v)"/>
  <circle cx="1010" cy="300" r="4" fill="#7c3aed"/><text x="1002" y="296" font-size="11" font-family="ui-monospace,monospace" text-anchor="end" fill="#0f172a">OUT+</text>
  <circle cx="1010" cy="345" r="4" fill="#7c3aed"/><text x="1002" y="341" font-size="11" font-family="ui-monospace,monospace" text-anchor="end" fill="#0f172a">OUT−</text>

  <text x="565" y="465" font-size="11" fill="#7c3aed" text-anchor="middle">Wi-Fi AP + web (admin / spectator)</text>

  <text x="40" y="560" font-size="12" fill="#64748b">The master C5 runs no receiver, so GPIO 16-22 (its SPI flash) stay clear: the amp uses the proven C5 pins 9/8/7/10 (SD on 10; GPIO7 is strapping).</text>
  <text x="40" y="580" font-size="12" fill="#64748b">Swap this C5 for a real C6 later with no wiring change on the gate side; only the master's amp pins move to 18/19/20/21 on the C6.</text>
</svg>
