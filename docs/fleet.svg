<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="aGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="aViolet" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="aTeal" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0d9488"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
  <text x="40" y="44" font-size="25" font-weight="700" fill="#0f172a">FPV 5.8 Checkpoint — fleet architecture</text>
  <text x="40" y="68" font-size="14" fill="#64748b">Each gate is an ESP32-C5 detector. The C6 master aggregates its own C5 and remote C5/C3 nodes over ESP-NOW, times laps and plays the sound.</text>

  <!-- ===================== MASTER SET ===================== -->
  <rect x="34" y="92" width="520" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="50" y="114" font-size="13" font-weight="700" fill="#64748b">MASTER SET</text>

  <!-- Admin device -->
  <rect x="300" y="120" width="170" height="80" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="385" y="152" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Admin</text>
  <text x="385" y="172" font-size="11" fill="#64748b" text-anchor="middle">phone / laptop browser</text>

  <!-- C6 master -->
  <rect x="300" y="250" width="200" height="150" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="400" y="282" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C6</text>
  <text x="400" y="302" font-size="11" fill="#64748b" text-anchor="middle">master</text>
  <text x="400" y="322" font-size="11" fill="#64748b" text-anchor="middle">fleet hub · race timing</text>
  <text x="400" y="338" font-size="11" fill="#64748b" text-anchor="middle">Wi-Fi AP + admin web</text>
  <text x="400" y="354" font-size="11" fill="#64748b" text-anchor="middle">centralized sound</text>

  <!-- C5 gate 0 -->
  <rect x="60" y="280" width="160" height="90" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="140" y="312" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C5</text>
  <text x="140" y="332" font-size="11" fill="#64748b" text-anchor="middle">gate 0 (local)</text>
  <text x="140" y="348" font-size="11" fill="#64748b" text-anchor="middle">RF receive + detect</text>

  <!-- amp + speaker -->
  <rect x="120" y="470" width="150" height="74" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="195" y="500" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">MAX98357A</text>
  <text x="195" y="518" font-size="11" fill="#64748b" text-anchor="middle">I2S amplifier</text>
  <path d="M310,484 h26 l30,-24 v104 l-30,-24 h-26 Z" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="352" y="574" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle">4 Ω</text>

  <!-- master links -->
  <line x1="220" y1="325" x2="300" y2="325" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="260" y="316" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600">UART</text>
  <text x="260" y="300" font-size="10" fill="#475569" text-anchor="middle">C5 6/8 · C6 4/5</text>

  <line x1="340" y1="400" x2="200" y2="470" stroke="#0d9488" stroke-width="2.5" marker-end="url(#aTeal)"/>
  <text x="232" y="443" font-size="10" fill="#0d9488" font-weight="600">I2S 18/19/20/21</text>
  <line x1="270" y1="507" x2="310" y2="507" stroke="#0d9488" stroke-width="2.5" marker-end="url(#aTeal)"/>

  <line x1="390" y1="250" x2="378" y2="200" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#aViolet)"/>
  <text x="470" y="228" font-size="10" fill="#7c3aed" text-anchor="middle">Wi-Fi web</text>

  <!-- ===================== NODE SETS ===================== -->
  <rect x="640" y="92" width="526" height="430" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="656" y="114" font-size="13" font-weight="700" fill="#64748b">NODE SETS (gates 1..N)</text>

  <!-- node A -->
  <rect x="690" y="150" width="150" height="96" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="765" y="190" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C3</text>
  <text x="765" y="210" font-size="11" fill="#64748b" text-anchor="middle">node bridge</text>
  <rect x="980" y="150" width="160" height="96" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1060" y="190" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C5</text>
  <text x="1060" y="210" font-size="11" fill="#64748b" text-anchor="middle">gate 1</text>
  <line x1="980" y1="198" x2="840" y2="198" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="910" y="190" font-size="10" fill="#475569" text-anchor="middle">UART C5 6/8 · C3 5/4</text>

  <!-- node B -->
  <rect x="690" y="330" width="150" height="96" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="765" y="370" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C3</text>
  <text x="765" y="390" font-size="11" fill="#64748b" text-anchor="middle">node bridge</text>
  <rect x="980" y="330" width="160" height="96" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1060" y="370" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C5</text>
  <text x="1060" y="390" font-size="11" fill="#64748b" text-anchor="middle">gate 2</text>
  <line x1="980" y1="378" x2="840" y2="378" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aGreen)"/>
  <text x="910" y="370" font-size="10" fill="#475569" text-anchor="middle">UART C5 6/8 · C3 5/4</text>

  <text x="765" y="470" font-size="12" fill="#64748b" text-anchor="middle">+ more gates…</text>
  <text x="915" y="498" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Degraded: a C3 that can't reach the C6 at boot serves its own AP + web (band select + results).</text>

  <!-- ESP-NOW links C3 -> C6 -->
  <line x1="690" y1="198" x2="500" y2="312" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aBlue)"/>
  <line x1="690" y1="378" x2="500" y2="340" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#aBlue)"/>
  <text x="590" y="250" font-size="11" fill="#2563eb" font-weight="600" text-anchor="middle">ESP-NOW</text>
  <text x="590" y="266" font-size="10" fill="#475569" text-anchor="middle">fleet_proto · shared Wi-Fi channel</text>

  <!-- ===================== INTERACTIONS note + LEGEND ===================== -->
  <text x="40" y="690" font-size="12" fill="#64748b">Flow: a drone crossing a gate → the C5 detects a C/N peak → reports over UART → the bridge timestamps it in fleet time →</text>
  <text x="40" y="708" font-size="12" fill="#64748b">the C6 times the lap/sector per channel and plays the coin sound. The C6 assigns each gate a channel; SET_CHANNEL retunes its C5.</text>

  <g font-size="12" fill="#0f172a">
    <rect x="640" y="548" width="526" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="656" y="570" font-weight="700">Links</text>
    <line x1="656" y1="590" x2="690" y2="590" stroke="#16a34a" stroke-width="3"/><text x="698" y="594">UART — link_proto (passes, config, SET_CHANNEL)</text>
    <line x1="656" y1="612" x2="690" y2="612" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 4"/><text x="698" y="616">ESP-NOW — fleet_proto (pairing, events, time)</text>
    <line x1="656" y1="634" x2="690" y2="634" stroke="#7c3aed" stroke-width="3"/><text x="698" y="638">Wi-Fi — admin / degraded web</text>
    <line x1="980" y1="634" x2="1014" y2="634" stroke="#0d9488" stroke-width="3"/><text x="1022" y="638">I2S — audio</text>
  </g>
</svg>
