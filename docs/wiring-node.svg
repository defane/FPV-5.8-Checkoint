<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-size="23" font-weight="700" fill="#0f172a">Node set — C3 + C5 (gate 1..N)</text>
  <text x="40" y="66" font-size="13" fill="#64748b">A remote gate: the C5 detects, the C3 relays to the C6 over ESP-NOW. No amplifier — the sound is centralized on the C6.</text>

  <!-- C5 -->
  <rect x="60" y="150" width="200" height="230" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="160" y="184" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C5</text>
  <text x="160" y="203" font-size="11" fill="#64748b" text-anchor="middle">gate · RF detect</text>
  <!-- C3 -->
  <rect x="470" y="150" width="200" height="230" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="570" y="184" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ESP32-C3</text>
  <text x="570" y="203" font-size="11" fill="#64748b" text-anchor="middle">node bridge</text>

  <!-- UART -->
  <line x1="260" y1="240" x2="470" y2="240" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="470" y1="290" x2="260" y2="290" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="260" y1="350" x2="470" y2="350" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="365" y="232" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600">UART link_proto</text>
  <g font-size="11" font-family="ui-monospace,monospace" fill="#0f172a">
    <circle cx="260" cy="240" r="4" fill="#16a34a"/><text x="252" y="236" text-anchor="end">GPIO6 TX</text>
    <circle cx="260" cy="290" r="4" fill="#16a34a"/><text x="252" y="286" text-anchor="end">GPIO15 RX</text>
    <circle cx="260" cy="350" r="4" fill="#475569"/><text x="252" y="346" text-anchor="end">GND</text>
    <circle cx="470" cy="240" r="4" fill="#16a34a"/><text x="478" y="236">GPIO4 RX</text>
    <circle cx="470" cy="290" r="4" fill="#16a34a"/><text x="478" y="286">GPIO5 TX</text>
    <circle cx="470" cy="350" r="4" fill="#475569"/><text x="478" y="346">GND</text>
  </g>

  <!-- ESP-NOW to C6 -->
  <line x1="670" y1="250" x2="860" y2="250" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#b)"/>
  <text x="765" y="242" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="600">ESP-NOW</text>
  <text x="900" y="246" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">C6</text>
  <text x="900" y="264" font-size="11" fill="#64748b" text-anchor="middle">master</text>

  <text x="40" y="420" font-size="12" fill="#64748b">Crossed UART, common ground. ESP-NOW uses no GPIO (shared Wi-Fi channel with the C6).</text>
  <text x="40" y="440" font-size="12" fill="#64748b">If the C6 is unreachable at boot, the C3 serves a local AP + web (band select + results) instead of relaying.</text>
</svg>
